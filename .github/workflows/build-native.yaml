name: Build Server Candidate

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: "ghcr.io/thermcampos/rinha-de-backend-2026/backend"

jobs:
  build-and-push-server:
    name: Build & Push Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Set up musl toolchain
        working-directory: /tmp
        run: |
          export MUSL_HOME=/opt/musl-toolchain
          curl -sSLO https://musl.libc.org/releases/musl-1.2.6.tar.gz
          curl -sSLO https://zlib.net/fossils/zlib-1.3.1.tar.gz
          tar xzf musl-1.2.6.tar.gz
          cd musl-1.2.6
          ./configure --prefix=$MUSL_HOME --static
          make -j"$(nproc)"
          sudo make install
          sudo ln -s $MUSL_HOME/bin/musl-gcc $MUSL_HOME/bin/x86_64-linux-musl-gcc
          cd ..
          tar xzf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          CC=$MUSL_HOME/bin/musl-gcc ./configure --prefix=$MUSL_HOME --static
          make -j"$(nproc)"
          sudo make install
          echo "$MUSL_HOME/bin" >> "$GITHUB_PATH"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native binary
        working-directory: ./backend
        run: ./mvnw -P native package

      - name: Build Docker image
        working-directory: ./backend
        run: docker build -f Dockerfile.native -t ${{ env.DOCKER_IMAGE }}:latest .

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Log pushed images
        run: |
          echo "Pushed images:"
          echo "  ${{ env.DOCKER_IMAGE }}:latest"

