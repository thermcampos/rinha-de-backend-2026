name: Build Server Candidate

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE: "ghcr.io/thermcampos/rinha-de-backend-2026/backend"

jobs:
  build-and-push-server:
    name: Build & Push Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: ./backend
        run: ./mvnw -P native package

      - name: Tag image
        run: docker tag app-native ${{ env.DOCKER_IMAGE }}:latest

      - name: Push image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Log pushed images
        run: |
          echo "Pushed images:"
          echo "  ${{ env.DOCKER_IMAGE }}:latest"

