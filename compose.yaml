---

services:
  rinha-lb:
    image: haproxy:3.4-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on:
      - rinha-backend-one
      - rinha-backend-rwo
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 20MB

  rinha-prod-db:
    image: postgres:16-alpine
    container_name: rinha-prod-db
    environment:
      POSTGRES_USER: rinha-prod
      POSTGRES_PASSWORD: rinha-prod
      POSTGRES_DB: rinha-prod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinha-prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rinha-network-prod

  rinha-backend-one:
    container_name: rinha-backend-one
    environment:
      RINHA_SERVER_PORT: 8881
      RINHA_SERVER_INSTANCE: one
      RINHA_DB_URL: jdbc:postgresql://rinha-prod-db:5432/rinha-prod
      RINHA_DB_USER: rinha-prod
      RINHA_DB_PASSWORD: rinha-prod
    ports:
      - 8881:8881
    image: ghcr.io/thermcampos/rinha-de-backend-2026/backend:latest
    depends_on:
      rinha-prod-db:
        condition: service_healthy
    networks:
      - rinha-network-prod
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 165MB

  rinha-backend-two:
    container_name: rinha-backend-two
    environment:
      RINHA_SERVER_PORT: 8882
      RINHA_SERVER_INSTANCE: two
      RINHA_DB_URL: jdbc:postgresql://rinha-prod-db:5432/rinha-prod
      RINHA_DB_USER: rinha-prod
      RINHA_DB_PASSWORD: rinha-prod
    ports:
      - 8882:8882
    image: ghcr.io/thermcampos/rinha-de-backend-2026/backend:latest
    depends_on:
      rinha-prod-db:
        condition: service_healthy
    networks:
      - rinha-network-prod
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 165MB

networks:
  rinha-network-prod:

